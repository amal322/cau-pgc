/* =====================================================================
   Блок документов на дашборде
   ===================================================================== */
async function fillDocDash() {
  const box = $('#docdash'); if (!box) return;
  try {
    const X = await api.docStats(); const docs = X.docs, steps = X.steps;
    const c = st => docs.filter(d => d.live_status === st).length;
    const over = steps.filter(s => s.state === 'pending' && s.role !== 'cc' && s.due_at && new Date(s.due_at) < new Date()).length;
    const doneR = X.routes.filter(r => r.status === 'approved' && r.completed_at);
    const avg = doneR.length ? (doneR.reduce((a, r) => a + (new Date(r.completed_at) - new Date(r.created_at)) / 864e5, 0) / doneR.length).toFixed(1) : '—';
    const kpi = (v, l, col, href) => `<a class="card kpi2" href="${href}" style="--k:${col}"><div class="v">${v}</div><div class="l">${l}</div></a>`;
    const byType = {}; doneR.forEach(r => { const d = docs.find(x => x.id === r.document_id); if (!d) return; const k = typeName(d); (byType[k] = byType[k] || []).push((new Date(r.completed_at) - new Date(r.created_at)) / 864e5); });
    const resp = {}; steps.filter(s => s.decided_at && s.activated_at && s.role !== 'cc' && !['skipped'].includes(s.state)).forEach(s => { (resp[s.assignee_id] = resp[s.assignee_id] || []).push((new Date(s.decided_at) - new Date(s.activated_at)) / 36e5); });
    const avgArr = a => a.reduce((x, y) => x + y, 0) / a.length;
    const byDept = {}; docs.forEach(d => { byDept[d.department] = (byDept[d.department] || 0) + 1; });
    const exp = docs.filter(d => d.days_left !== null && d.days_left >= 0 && d.days_left <= 90 && ['active', 'expiring', 'approved'].includes(d.live_status)).sort((a, b) => a.days_left - b.days_left);
    const mine = steps.filter(s => s.assignee_id === S.me.id && s.state === 'pending');
    box.innerHTML = `<h2 class="dash-h">${L('Documents', 'Документы')}</h2>
      <div class="grid kpis2">${kpi(c('active') + c('expiring'), L('valid documents', 'действующих'), '#2DBE82', '#/documents')}${kpi(c('in_approval'), L('in approval', 'на согласовании'), '#22A3E0', '#/documents')}${kpi(over, L('overdue approval steps', 'просроченных шагов'), over ? '#E25555' : '#8C95B0', '#/approvals')}${kpi(c('expiring'), L('expire within 30 days', 'истекают в 30 дней'), '#C9930F', '#/documents')}${kpi(c('expired'), L('expired', 'истекли'), c('expired') ? '#E25555' : '#8C95B0', '#/documents')}${kpi(avg, L('avg days to approve', 'дней в среднем на согласование'), '#8A6CF0', '#/approvals')}</div>
      <div class="grid g-3" style="margin-top:18px">
        <div class="card"><div class="card-h"><h3>${L('Waiting for me', 'Ждут меня')}</h3><span class="muted">${mine.length}</span></div><div class="card-b">${mine.length ? mine.slice(0, 6).map(s => { const r = X.routes.find(x => x.id === s.route_id) || {}, d = docs.find(x => x.id === r.document_id) || {}; return `<div class="li" data-go="doc/${d.id}/approval"><div style="flex:1;min-width:0"><div class="li-t"><span class="regno">${h(d.reg_no || '')}</span> <span data-notr>${h(d.title || '')}</span></div><div class="li-m">${ROLE_S[s.role][2]} ${lb(ROLE_S[s.role])}</div></div></div>`; }).join('') : `<div class="empty">🎉 ${L('Nothing to approve', 'Нечего согласовывать')}</div>`}</div></div>
        <div class="card"><div class="card-h"><h3>${L('Expiring in 90 days', 'Истекают в 90 дней')}</h3><span class="muted">${exp.length}</span></div><div class="card-b">${exp.length ? exp.slice(0, 6).map(d => `<div class="li" data-go="doc/${d.id}"><div style="flex:1;min-width:0"><div class="li-t"><span class="regno">${h(d.reg_no)}</span> <span data-notr>${h(d.title)}</span></div><div class="li-m">${validityChip(d)}</div></div></div>`).join('') : `<div class="empty">${L('Nothing expires soon', 'Ничего не истекает')}</div>`}</div></div>
        <div class="card"><div class="card-h"><h3>${L('By status', 'По статусам')}</h3></div><div class="card-b">${bars(Object.entries(DOC_ST).map(([k, v]) => ({ label: lb(v), value: docs.filter(d => d.live_status === k).length, color: v[2] })).filter(x => x.value))}</div></div></div>
      <div class="grid g-3" style="margin-top:18px">
        <div class="card"><div class="card-h"><h3>${L('Avg approval time by type', 'Среднее время согласования по типам')}</h3><span class="muted">${L('days', 'дни')}</span></div><div class="card-b">${bars(Object.entries(byType).map(([k, a]) => ({ label: k, value: +avgArr(a).toFixed(1) })), '#8A6CF0')}</div></div>
        <div class="card"><div class="card-h"><h3>${L('Response time by approver', 'Время ответа согласующих')}</h3><span class="muted">${L('hours', 'часы')}</span></div><div class="card-b">${bars(Object.entries(resp).map(([k, a]) => ({ label: profName(k) || '—', value: Math.round(avgArr(a)) })).sort((a, b) => b.value - a.value).slice(0, 8), '#22A3E0')}</div></div>
        <div class="card"><div class="card-h"><h3>${L('Documents by department', 'Документы по отделам')}</h3></div><div class="card-b">${bars(Object.entries(byDept).map(([k, v]) => ({ label: k, value: v })).sort((a, b) => b.value - a.value).slice(0, 8), '#001966')}</div></div></div>`;
    bindGo(box);
  } catch (e) { box.innerHTML = ''; console.error(e); }
}

async function refreshCounts() {
  try { const c = await api.docCounts(); S.myPending = c.myPending; S.pendingCR = c.pendingCR; $$('[data-navcount="approvals"]').forEach(e => { e.textContent = S.myPending || ''; e.hidden = !S.myPending; }); $$('[data-navcount="control"]').forEach(e => { e.textContent = S.pendingCR || ''; e.hidden = !S.pendingCR; }); } catch {}
}

function setLang(l) { if (l === window.LANG) return; ls.set('oec_lang', l); if (S.me && !DEMO) api.updateProfile(S.me.id, { lang: l }).catch(() => {}); location.reload(); }
function bindLang() { $$('[data-lang]').forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang))); }

/* =====================================================================
   Роутер и запуск
   ===================================================================== */
async function route() {
  if (!S.me) return;
  if (S.me.role === 'pending') return viewPending();
  const [, name = 'dashboard', arg, sub] = (location.hash || '#/dashboard').split('/');
  if (!S.me.full_name && name !== 'profile' && name !== 'new') { location.hash = '#/profile'; return; }
  closeModal();
  window.scrollTo(0, 0);
  try {
    if (['dashboard', 'registry', 'timeline', 'my', 'admin'].includes(name)) await reloadProblems();
    switch (name) {
      case 'registry': return viewRegistry();
      case 'documents': return viewDocuments();
      case 'docnew': return viewDocNew();
      case 'doc': return viewDoc(+arg, sub);
      case 'approvals': return viewApprovals(arg);
      case 'sheet': return viewSheet(+arg);
      case 'control': return viewControl(arg);
      case 'timeline': return viewTimeline();
      case 'p': return viewProblem(arg);
      case 'new': return viewWizard();
      case 'edit': return viewWizard(arg);
      case 'my': return viewMy();
      case 'admin': return viewAdmin(arg);
      case 'profile': return viewProfile();
      default: mount(viewDashboard()); playIntro(); return fillDocDash();
    }
  } catch (e) { console.error(e); toast(errMsg(e), true); }
}
let booting = false;
async function boot() {
  if (booting) return; booting = true;
  window.I18N?.start();
  if (window.LANG === 'en') document.title = 'OEC · Development Areas & Documents';
  $('#root').innerHTML = BOOT_HTML();
  try {
    const session = await api.session();
    if (!session) return viewAuth('in');
    if (recovering) return viewSetPassword();
    await loadAll();
    route();
  } catch (e) { console.error(e); toast(errMsg(e), true); viewAuth('in'); }
  finally { booting = false; }
}
window.addEventListener('hashchange', () => { if (!recovering) route(); });
let recovering = /type=recovery/.test(location.hash);
api.onAuth(ev => { if (ev === 'PASSWORD_RECOVERY') { recovering = true; viewSetPassword(); return; } if (recovering) return; if (ev === 'SIGNED_OUT') { S.me = null; viewAuth('in'); } if (ev === 'SIGNED_IN' && !S.me) boot(); });
boot();
</script>
